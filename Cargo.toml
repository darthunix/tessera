[workspace]
members = [
    "crates/tessera-core",
    "crates/tessera-capi",
    "crates/tessera-kernels",
    "crates/tessera-spill",
    "tools/tessera-bench",
    "tools/tessera-pmu",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "PostgreSQL"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
memchr = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tessera-core = { path = "crates/tessera-core" }
tessera-kernels = { path = "crates/tessera-kernels" }
tessera-spill = { path = "crates/tessera-spill" }
tessera-pmu = { path = "tools/tessera-pmu" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
