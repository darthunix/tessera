[workspace]
members = ["crates/tessera-core", "crates/tessera-capi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "PostgreSQL"
publish = false

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
