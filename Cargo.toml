[workspace]
members = [
    "crates/tessera-core",
    "crates/tessera-capi",
    "crates/tessera-kernels",
    "crates/tessera-spill",
    "crates/tessera-testing",
    "tools/tessera-ab",
    "tools/tessera-bench",
    "tools/tessera-crosscheck",
    "tools/tessera-pgtool",
    "tools/tessera-pmu",
    "tools/tessera-tpch",
]
resolver = "3"

[workspace.package]
# The C modules report the same version (TESS_VERSION, include/tessera/abi.h).
version = "0.1.0"
edition = "2024"
# The toolchain of rust-toolchain.toml: the one compiler the repository builds
# and tests with, so no older one is promised.
rust-version = "1.98.1"
license = "PostgreSQL"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
comfy-table = "8"
console = "0.16"
indicatif = "0.18"
memchr = "2.8"
postgres = "0.19"
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tpchgen = "3.0"
tessera-core = { path = "crates/tessera-core" }
tessera-kernels = { path = "crates/tessera-kernels" }
tessera-spill = { path = "crates/tessera-spill" }
tessera-testing = { path = "crates/tessera-testing" }
tessera-pgtool = { path = "tools/tessera-pgtool" }
tessera-pmu = { path = "tools/tessera-pmu" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

# A panic in the library is caught at the C boundary and fails the query,
# but a path to one is a bug to remove, not to rely on: production code
# says why a value is there instead of unwrapping it (plan 9.2). Tests
# report failures by panicking, which clippy.toml allows there.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
