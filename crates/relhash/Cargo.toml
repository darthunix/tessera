[package]
name = "relhash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A hash table for the joins and the groupings of relational databases, in memory its caller gives"
repository = "https://github.com/darthunix/tessera"
readme = "README.md"
# A crate meant for use outside Tessera, whose API a spec may name
# (CONTRIBUTING.md); it is not published on crates.io for now.
publish = true

[features]
default = ["alloc"]
# OwnedTable, the table that owns its memory and so allocates it.
alloc = []

[dev-dependencies]
anyhow.workspace = true
proptest.workspace = true

# The model table of the table module, which other crates' loom models run
# over.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true
