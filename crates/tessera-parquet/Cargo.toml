[package]
name = "tessera-parquet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The reader of Parquet files under Tessera's Parquet foreign data wrapper"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# The writer of the suites' Parquet files, for tests and the test module.
test-files = []

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
bytes.workspace = true
datum-arrow.workspace = true
parquet.workspace = true
# The pattern of LIKE of fixed parts and `%`, the kernels' own, so that
# the source and the filter match a string by one rule.
tessera-kernels.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
