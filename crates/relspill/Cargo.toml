[package]
name = "relspill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The spill of the joins, groupings and sorts of relational databases to temporary files, which its caller reads and writes"
repository = "https://github.com/darthunix/tessera"
# A crate meant for use outside Tessera, whose API a spec may name
# (CONTRIBUTING.md); it is not published on crates.io for now.
publish = true

[dependencies]
anyhow.workspace = true
relhash.workspace = true

[dev-dependencies]
proptest.workspace = true

# The loom models of the spill words and the phases, over relhash's model
# table.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true
