# Mutation testing of the Rust crates (plan 9.9, .cargo/mutants.toml).
# A pull request that changes the crates gets the mutants of its changed
# lines in three shards; a run by hand (workflow_dispatch) takes every
# mutant in eight. A missed mutant fails the job: a change the tests do not notice.
# A timeout or a mutant that does not build does not. The runners are
# arm64 macOS, where the NEON kernels compile.
name: Mutants

on:
  pull_request:
    paths:
      - "crates/**"
      - ".cargo/mutants.toml"
  workflow_dispatch:

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Mutants of the changed lines, shard ${{ matrix.shard }} of 3
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # A mutant takes about a minute (its build and every test), a loop
      # made endless 82 s: the 136 mutants of plan 9.16 took an hour on
      # one runner. Three shards take three of the account's five macOS
      # runners, leaving two for CI: 25 minutes each for plan 9.16, 30 to
      # 40 for the 270 mutants of plan 9.17, whose second shard ran out of
      # 40 minutes a second after its last mutant was caught.
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: The pull request's diff of the crates
        run: |
          mkdir -p target
          git diff "origin/${{ github.base_ref }}...HEAD" -- crates > target/pr.diff
          wc -l target/pr.diff
      - name: Mutants in the changed lines
        run: |
          # 2: a mutant was missed; 3: only timeouts; 0: none missed.
          code=0
          cargo mutants --in-diff target/pr.diff --shard ${{ matrix.shard }}/3 --no-shuffle --jobs 2 || code=$?
          test "$code" -eq 0 || test "$code" -eq 3
      - name: The mutants' outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-diff-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  all:
    name: Mutants, shard ${{ matrix.shard }} of 8
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # A shard takes two to three hours on a macOS runner, and an account
      # gets five of them at once: three shards leave two for the CI of
      # pull requests, which otherwise waits behind the run for hours.
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Every mutant of the shard
        run: |
          code=0
          cargo mutants --shard ${{ matrix.shard }}/8 --no-shuffle --jobs 2 || code=$?
          test "$code" -eq 0 || test "$code" -eq 3
      - name: The mutants' outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
