# The fuzz targets of relhash, relspill and tessera-parquet
# (crates/*/fuzz), under AddressSanitizer. Those of relhash: tables
# built from the fuzzer's bytes, damaged where they choose, and the
# crate's calls over them, with any arguments. Those of relspill: any
# bytes as a set's file, a set written and damaged where they choose,
# every read over it; and the machines stepped by any events and
# numbers. That of tessera-parquet: any bytes, and streams of snap's
# encoder with a byte changed, into the reader's decoder of Snappy
# against snap's. A pull request that changes one of the crates runs
# each target of all three for a minute; a run by hand
# (workflow_dispatch) for as long as it is given, an hour by default,
# before a release of a crate. An input that fails is kept as an
# artifact, and becomes a case of the crate's matrix of damage or of a
# machine's tests.
name: Fuzz

on:
  pull_request:
    paths:
      - "crates/relhash/**"
      - "crates/relspill/**"
      - "crates/tessera-parquet/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds each target runs
        default: "3600"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.crate }} (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        crate: [relhash, relspill, tessera-parquet]
    env:
      # cargo-fuzz needs a nightly: the one Miri's job pins.
      RUSTUP_TOOLCHAIN: nightly-2026-09-11
      SECONDS_EACH: ${{ inputs.seconds || '60' }}
    steps:
      - uses: actions/checkout@v4
      - name: The pinned nightly
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.crate }}
          workspaces: "crates/${{ matrix.crate }}/fuzz -> target"
      # The workspace's checks do not reach this crate.
      - name: The format and lints of the targets
        working-directory: crates/${{ matrix.crate }}/fuzz
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Each target
        working-directory: crates/${{ matrix.crate }}
        # The cargo-fuzz installed is built for musl and builds for it
        # unless told: AddressSanitizer needs the host's glibc. An input
        # that runs ten seconds is taken for a call without end.
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          for target in $(cargo fuzz list); do
            cargo fuzz run --target "$host" "$target" -- \
              -max_total_time="$SECONDS_EACH" -timeout=10 -rss_limit_mb=4096
          done
      - name: The inputs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.crate }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts
          if-no-files-found: ignore
