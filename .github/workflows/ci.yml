# Correctness on every push: the Rust workspace on x86_64 Linux (the scalar
# kernels) and on arm64 macOS (the NEON kernels), and the PostgreSQL modules
# with every regression suite against the revisions in postgres.env, with the
# release kernels library and, on Linux, also with the debug one, whose
# overflow checks and debug assertions the suites then exercise.
# The loom model of the hash table runs as a job of its own, and so does
# the check of openspec/ against the repository.
# Performance is measured locally (crates/tessera-capi/benches, bench/pg).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format, Clippy, debug and release tests
        run: make rust-check

  # openspec/ against the repository (CONTRIBUTING.md, "Specs"): the
  # form of every spec and change, the test each scenario names, the
  # files each design names, no closed change kept in the tree.
  specs:
    name: Specs (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      # The whole history: the contracts are read at the base of a pull
      # request.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.13.2
      - name: The cases of the check of contracts
        run: .github/scripts/test-check-contracts.sh
      - name: The specs against the repository
        env:
          DO_NOT_TRACK: "1"
          SPECS_BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/check-specs.sh

  # The loom model of the hash table's concurrent protocol (plan 9.5): the
  # bucket heads, the shared Bloom filter, the build phases and the shared
  # spill under every interleaving within the bounds the tests set. The
  # model is scalar code, so one platform is enough.
  loom:
    name: Loom model (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
          workspaces: ". -> target/loom"
      - name: make rust-loom
        run: make rust-loom
  # Every suite against PostgreSQL and Tessera's C built with
  # AddressSanitizer and UndefinedBehaviorSanitizer (plan 9.7): reads and
  # writes past a buffer, use after free and undefined behaviour in C,
  # which the suites' results and the core's assertions see only by
  # chance. The kernels library is not instrumented (Miri checks the Rust
  # side); its allocations still get the interceptor's red zones.
  sanitizers:
    name: Sanitizers (ubuntu-24.04, ASan and UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LANG: C.UTF-8
      # No leak reports: memory contexts free what malloc's view calls
      # leaked. No use after return: it breaks the core's stack-depth
      # check. No ODR violations: the runtime library is linked into the
      # nodes module and the test modules alike.
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:print_stacktrace=1:detect_stack_use_after_return=0:detect_odr_violation=0:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Revision
        id: revision
        run: |
          . .github/postgres.env
          echo "revision=$POSTGRES_MASTER" >> "$GITHUB_OUTPUT"
          echo "PG_CONFIG=$HOME/postgres/bin/pg_config" >> "$GITHUB_ENV"
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libicu-dev libreadline-dev zlib1g-dev pkg-config
      # The runners' kernels randomize mmap with more bits than ASan's
      # shadow layout takes; the default of older kernels fits it.
      - name: Address space for ASan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/cache@v4
        id: postgres
        with:
          path: ~/postgres
          key: postgres-asan-${{ runner.os }}-${{ runner.arch }}-${{ steps.revision.outputs.revision }}-${{ hashFiles('.github/scripts/build-postgres.sh') }}
      - name: Build PostgreSQL with the sanitizers
        if: steps.postgres.outputs.cache-hit != 'true'
        run: .github/scripts/build-postgres.sh ${{ steps.revision.outputs.revision }} "$HOME/postgres" asan
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build and install Tessera
        run: |
          make
          make install
      - name: Regression suites and the installed set
        run: make installcheck EXTRA_REGRESS_OPTS="--temp-instance=$RUNNER_TEMP/cluster"
      - name: The sanitizers' reports
        if: failure()
        run: |
          # The first report and the crash it caused, before the noise of
          # the suites that ran into the recovery after it.
          grep -n -B2 -A60 -E 'AddressSanitizer|runtime error:|TRAP:|terminated by signal|was terminated' test/log/postmaster.log 2>/dev/null | head -300 || true
          grep -c '' test/log/postmaster.log 2>/dev/null || true
      - name: The suites' logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizers-logs
          path: |
            test/log
            test/regression.diffs
          if-no-files-found: ignore

  # Miri over the tests of the unsafe code (plan 9.6): the hash table's
  # region in tessera-kernels (its table module; the vector code is cut
  # out under Miri, the rest of the crate denies unsafe code) and the C
  # entry points' borrows in tessera-capi. tessera-core forbids unsafe
  # code and tessera-spill has none. A nightly pinned here, not in
  # rust-toolchain.toml; few property cases, as Miri runs each slowly;
  # isolation off, for proptest's files of failures.
  miri:
    name: Miri (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-09-11
      PROPTEST_CASES: "16"
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - name: The pinned nightly with Miri
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: Miri's standard library
        run: cargo miri setup
      - name: The tests of the unsafe code
        run: |
          cargo miri test --locked -p tessera-kernels --lib table::
          cargo miri test --locked -p tessera-capi --test columns --test table

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} (${{ matrix.os }}, ${{ matrix.rust_profile }} kernels)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, postgres: MASTER, rust_profile: release }
          - { os: macos-15, postgres: MASTER, rust_profile: release }
          - { os: ubuntu-24.04, postgres: MASTER, rust_profile: debug }
    runs-on: ${{ matrix.os }}
    env:
      # The temporary instance's locale (test/Makefile).
      LANG: C.UTF-8
      # The kernels library the modules link (rust.mk): make, make install
      # and make installcheck all read it from the environment.
      RUST_PROFILE: ${{ matrix.rust_profile }}
    steps:
      - uses: actions/checkout@v4
      - name: Revision
        id: revision
        run: |
          . .github/postgres.env
          eval "echo revision=\$POSTGRES_${{ matrix.postgres }}" >> "$GITHUB_OUTPUT"
          echo "PG_CONFIG=$HOME/postgres/bin/pg_config" >> "$GITHUB_ENV"
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libicu-dev libreadline-dev zlib1g-dev pkg-config
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install icu4c pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: postgres
        with:
          path: ~/postgres
          key: postgres-${{ runner.os }}-${{ runner.arch }}-${{ steps.revision.outputs.revision }}-${{ hashFiles('.github/scripts/build-postgres.sh') }}
      - name: Build PostgreSQL
        if: steps.postgres.outputs.cache-hit != 'true'
        run: .github/scripts/build-postgres.sh ${{ steps.revision.outputs.revision }} "$HOME/postgres"
      - name: Toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # COPT reaches the compiler through PostgreSQL's Makefile.global, in
      # every sub-make: Tessera's own C, its test modules and the installed
      # set's check build with warnings as errors here, not for users.
      - name: Build and install Tessera
        run: |
          make COPT=-Werror
          make install COPT=-Werror
      - name: Regression suites and the installed set
        run: make installcheck COPT=-Werror EXTRA_REGRESS_OPTS="--temp-instance=$RUNNER_TEMP/cluster"
      # Random queries with Tessera on and off (plan 9.8): the seeds of
      # seeds.txt, then 3000 queries of seed 1, about ten seconds. A
      # disagreement fails the run; its shrunk case is the artifact below.
      - name: Random queries against the core
        if: matrix.os == 'ubuntu-24.04' && matrix.rust_profile == 'release'
        # The Rust cache brings target/ back, with what a run left there.
        run: |
          rm -rf target/bench-runs
          cargo run --release --locked -p tessera-crosscheck -- --seed 1 --queries 3000 --time-limit 90 --no-install
      - name: The random queries' findings
        if: always() && matrix.os == 'ubuntu-24.04' && matrix.rust_profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: crosscheck-findings
          path: target/bench-runs/crosscheck
          if-no-files-found: ignore
      - name: Differences and the server's log
        if: failure()
        run: |
          cat test/regression.diffs 2>/dev/null || true
          # A failed assertion or a signal, with the trace that follows it.
          grep -n -A30 -E 'TRAP:|terminated by signal' test/log/postmaster.log 2>/dev/null | head -300 || true
          tail -n 50 test/log/postmaster.log 2>/dev/null || true
