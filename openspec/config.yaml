schema: spec-driven

# Shown to an agent with the instructions of every artifact. The rules
# of work that hold in any session are in CONTRIBUTING.md, not here:
# this file reaches an agent only through the OpenSpec workflows.
context: |
  Tessera is a PostgreSQL extension that runs parts of a query plan in
  batches: C modules (bridge, runtime, nodes, kernels) and Rust kernels
  behind a C API. CONTRIBUTING.md at the root of the repository holds
  the rules of work: building, checks, commits, measurements. Read it
  first.

  A capability is one part of the system and one folder,
  openspec/specs/<name>/. spec.md says what the part promises.
  design.md says how it is built and why; OpenSpec does not read it,
  people and agents keep it by hand. Where the two disagree, spec.md
  is right. contract.md, where a part has one, holds the rules of the
  part's build (CONTRIBUTING.md, "Architecture contracts").

  A spec names four surfaces only: the public C API of include/tessera;
  behavior visible from SQL (the plan chosen, the results, EXPLAIN,
  settings, SQLSTATE); formats on disk and in shared memory; the entry
  points of the kernels. Internal names and steps belong in design.md.

  A change is needed when behavior, the C API or a format changes, when
  work on speed needs a measurement plan, or when the work is larger
  than one pull request. The maintainer approves the proposal before
  any code and the outcome before the change is closed. A closed change
  leaves no folder: what it settled is in the specs, the designs and
  the roadmap, and git keeps the rest.

  A spec and a design are written for a reader who knows nothing about
  the part, in simple English: short sentences, common words, one
  thought in a sentence. Every term is explained where it first appears.
  In a spec a layout of data is a drawing in a code block with its
  offsets and sizes. A design goes from the whole to the details: what
  the part is for and the problem it solves; the engineering goals and
  what each choice costs; the design as a whole, with a picture; then
  each piece, with the alternatives refused; Files and Tests last. Both
  are self-contained: no reference to the working plan, the roadmap, a
  change or a pull request, and no dates.

  Everything in the repository is written in English. Markdown is
  wrapped at 72 columns and never runs past 80; what does not fit a line
  of a table is written as a list.

rules:
  proposal:
    - >-
      Say what is wrong today in "Why", with the numbers or the failing
      case that show it.
    - >-
      List under "Impact" the capabilities, public headers, settings and
      SQL suites the change touches.
    - >-
      Name the entry of openspec/roadmap.md that the change takes up, if
      it has one.
  specs:
    - >-
      One promise in a requirement, one to three scenarios for it, at
      most ten requirements in a change.
    - >-
      End every scenario with one bullet
      "- **Verified by:** `<path>::<text>`", where the path is a file in
      the repository and the text occurs in that file: the name of a
      test, or a mark "-- spec: <capability>/<scenario>" added to an SQL
      suite. Several tests are separated by "; ". The bullet may
      continue on the next lines, indented.
    - >-
      Write "- **Verified by:** review only — <reason>" when no test can
      show the scenario, and "- **Verified by:** pending" only while the
      change is open.
    - >-
      Define formats, lists of what is and is not supported and error
      codes in the spec, and draw a layout of data in a code block, with
      its offsets and sizes. A rule or a layout is written once, here: a
      design explains the idea and points to the spec for it.
    - >-
      Leave out measurements, numbers of the old plan's items and names
      of internal functions.
    - Name a capability in flat kebab-case; no folders inside folders.
  design:
    - >-
      Write "Was" and "Will be" for each thing that changes, and "What
      we do not do" with the reasons.
    - >-
      For work on speed add "Measurement plan" - what is measured, with
      which tool and cases, and the threshold that decides
      (docs/measuring.md).
    - Record each decision of the maintainer with its date.
  tasks:
    - >-
      A task is one commit that builds and passes the checks by itself;
      name the command that checks it.
    - >-
      Keep a mechanical move or rename in a task of its own, apart from
      changes of behavior.

operations:
  apply:
    guidance:
      - >-
        Decide alone, search and stop and ask as "Stop and ask" of
        CONTRIBUTING.md says.
      - >-
        Follow docs/measuring.md before timing anything.
  archive:
    guidance:
      - >-
        Write the outcome into the description of the pull request that
        closes the change, not into a file - what was done; what was
        measured, with the ids of the runs; where the work departed from
        the design and why; findings; what is left.
      - >-
        Bring openspec/specs/<capability>/design.md of each touched
        capability up to date with the decisions that change how it is
        built and their reasons, as part of its text: a design names no
        change, no pull request and no date.
      - Replace every "Verified by" that still says pending.
      - >-
        Remove the change's entry from openspec/roadmap.md, add an entry
        there for what is left, and put every finding the maintainer has
        not decided on into its list "Not placed".
      - >-
        After openspec archive, delete the folder it made under
        openspec/changes/archive/ in the same commit: a closed change
        leaves no folder, and git keeps its history.
      - >-
        The maintainer approves the outcome before the change is closed.
