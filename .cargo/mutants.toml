# cargo-mutants (plans 9.9 and 9.21): which code a mutant may change and
# how the tests judge it. `make rust-mutants` runs every mutant; CI runs
# those in the lines a pull request changes, and every one on request,
# both on arm64 Linux: the NEON kernels compile on any aarch64 (on x86-64
# they are cut out by cfg, and their mutants would survive unseen).
# The AVX2 primitives (simd/avx2.rs) compile on x86-64 alone, so their
# mutants would survive unseen here: .cargo/mutants-avx2.toml takes them,
# in a job of their own on x86-64 Linux, and the token of AVX2 too, which
# has no values off x86-64.

# The tools, the test strategies, the benchmark programs and the loom
# models are not the product. The table's loom models, their memory and
# the model table (table/loom/) compile only with --cfg loom, which a
# mutant's build lacks: each of their mutants would survive unseen. So do
# the table's proofs by Kani (table/proofs.rs), built only under Kani.
exclude_globs = [
    "tools/**",
    "crates/tessera-testing/**",
    "crates/tessera-capi/benches/**",
    "**/loom.rs",
    "crates/relhash/src/table/loom/**",
    "crates/relhash/src/table/proofs.rs",
    "crates/tessera-kernels/src/simd/avx2.rs",
]

# Debug output carries no logic; Display stays, it is the text of an error.
# The step of the walk over a word's bits (relhash::ones) makes every
# loop endless when mutated: a timeout each, never a verdict; its own
# tests check it.
# The same step written out where the iterator compiles to a longer loop
# or keeps no state between calls (WordValues::fold and next; the table's
# resolve_rows, append_rows, append_column_rows, and the keys'
# normalize_word and WordKeys::load, which those inline): their mutants
# of the step, their only &= and -.
# A batch of Datum rows all by value takes the column-wise path of an
# append (spill_columns::append) and writes the chunk the row-wise path
# writes: only the time tells them apart, so `by_value` false is the same.
# The ABI version is 0, so its mutant to 0 is the function itself.
# The constructors of the build's counters and of a spill over the loom
# model's words are compiled only for the model, which judges no mutant.
# sum_terms adds a word's decimals up by group before their records, for
# speed alone: exact sums add in any order, a NULL is skipped either way,
# and a row the local sums do not take goes to its record directly. A
# mutant that sends rows past them (local_group giving None or none from
# the start, the NULL arm gone, the guard false or turned) or that gives
# their hash of groups 18 slots for 32 leaves every sum and rest as it
# was. Two of these read as mutants the tests catch, so their place
# names them.
# The first word of a batch decides whether cast, count, the int
# aggregates, arithmetic, comparison, the hashes, the filter and the sets
# read whole words of a column's storage or its rows one by one: both give
# the same results, and only the time tells them apart. So do a word the
# whole-word loop refuses (blocks, bulk_passing and the hash's block giving
# None), a single row it sends to the rows (the comparison's guard, and
# the test of count's and the aggregates' loops, which with | or ^ sends
# empty and single-row words to the whole-word path instead), and the
# int8 arithmetic's arms of + and - gone, whose lanes then go one by one
# through the width's own function. The mutants of that choice are
# named by their place, since the same operators elsewhere in these
# functions matter.
# Off AArch64 the whole-word path ends in stubs on the empty token of NEON
# (cast's bulk, the hash's block), and the token converts into AVX2's:
# those are not built on the arm64 runners, so their mutants change
# nothing there, and on x86-64 no call reaches them.
# Place::reference puts a record's chunk above the bits of its unit, which
# is below 2^17 and has none there, and Cursor::at a chunk above a byte of
# 32 bits: | and ^ give one value. resolve_rows adds the rows a call
# created to the rows inserted before: a row is created once, so the two
# share no bit and | is ^.
# decimal::read_with keeps the rows of a word outside its selection and
# adds the rows it found in it: the two share no bit, so | is ^.
# OwnedTable::chunk_is_empty matters only when an append placed no row
# in an empty chunk, a record larger than a chunk, which OwnedTable::new
# refuses: false skips an error that never comes.
# Access::room replaced whole claims the same room in every chunk: the
# owning table then adds a chunk at each call, to the limit of 2^15
# chunks, gigabytes that kill the runner before a verdict. The checks
# inside it keep their mutants.
# The rest are relhash's, judged by its own tests (task 6.7 of the change
# table-crate):
# - A prefetch hint reads nothing and never faults: a hint gone, or one at
#   another address (the payload word of gather, the lines of
#   gather_words), changes no answer.
# - A choice between two ways that give one answer: gather with or without
#   its prefetch pass; a word of rows probed or resolved whole or row by
#   row (probe_rows, resolve_rows); a row the whole word did not find,
#   also when the word was probed with another word's hashes, found by
#   its own walk; a copy or a zeroing of four words inline or by
#   a call (copy_words, zero_words); the shape of the loop of a record's
#   tail words (Layout::tail_words), which the generic one writes alike.
# - An append whose chunk is full goes on over words with no room left
#   (append_rows, append_column_rows); a link finds no record of its keys
#   in a chain with no rest (link_counting): the loop ends later, the
#   answer the same.
# - A walk of a chain past a long chain's steps saves its place at each
#   doubling, Brent's method, to stop at a cycle soon; saved at other
#   steps, or never, the walk stops at the count of the places of the
#   chunks instead, later, with the same error. The bound of a short walk
#   checked at every step rather than at its limit (Access::find,
#   probe_word) stops it at the same count.
# - The mask of a hash in the Bloom filter keeps fewer bits when two of its
#   four coincide and | is ^: the filter is built and probed with the
#   same mask, so it rejects no key added, and lets a few more absent ones
#   through.
# - The owning table's blocks not freed leak: no answer changes.
exclude_re = [
    "<impl [a-z:]*Debug for ",
    "<impl Iterator for Ones>::next",
    "replace (&= with [|^]=|- with [+/]) in (<impl Iterator for WordValues<F>>::(fold|next)|resolve_rows|append_rows|append_column_rows|normalize_word|WordKeys<'a>::load)$",
    "replace <impl RowValues for DatumRows<'_>>::by_value -> bool with false$",
    "replace tess_kernels_abi_version -> u32 with 0$",
    "replace (Counters|Spill)<W>::over -> Self with Default::default\\(\\)$",
    "replace local_group -> Option<usize> with None$",
    "accumulate\\.rs:255:25: replace == with != in local_group$",
    "delete match arm Term::Null in sum_terms$",
    "replace match guard decimal\\.scale\\(\\) <= .* with false in sum_terms$",
    "replace <= with > in sum_terms$",
    "accumulate\\.rs:399:50: replace \\|\\| with && in sum_terms$",
    "accumulate\\.rs:[0-9]+:[0-9]+: replace \\* with \\+$",
    "cast\\.rs:7[34]:[0-9]+: replace (&& with \\|\\||>= with <) in int4_to_int8$",
    "count\\.rs:40:[0-9]+: replace >= with < in count$",
    "count\\.rs:65:[0-9]+: replace & with [|^] in count_bulk$",
    "int/aggregate\\.rs:7[45]:[0-9]+: replace (&& with \\|\\||>= with <) in aggregate$",
    "int/aggregate\\.rs:106:[0-9]+: replace & with [|^] in aggregate_bulk$",
    "int/arith\\.rs:20[56]:[0-9]+: replace (&& with \\|\\||>= with <) in run$",
    "int/arith\\.rs:(20[89]|210):[0-9]+: (replace|delete) .* in run$",
    "replace Operands<'_, T, L, R>::blocks -> Option<.*> with None$",
    "int/compare\\.rs:55:37: replace && with \\|\\| in run$",
    "int/compare\\.rs:(5[89]|60):[0-9]+: (replace|delete) .* in run$",
    "int/compare\\.rs:122:42: (delete ! in bulk|replace match guard .* in bulk)$",
    "int/compare\\.rs:144:5: replace blocks -> Option<.*> with None$",
    "int/hash\\.rs:(11[89]|120):[0-9]+: (replace|delete) .* in run$",
    "int/hash\\.rs:198:5: replace block -> Option<.*> with None$",
    "int/filter\\.rs:59:17: replace && with \\|\\| in filter_with$",
    "replace bulk_passing -> Option<u64> with None$",
    "set\\.rs:170:[0-9]+: replace (&& with \\|\\||<= with >) in in_set$",
    "delete match arm \\(ArithOp::(Add|Sub), _\\) in <impl IntLane for i64>::arith_block$",
    "cast\\.rs:258:9: replace bulk::widen -> u64 with [01]$",
    "int/hash\\.rs:216:5: replace block -> Option<.*> with ",
    "replace <impl From<Neon> for Avx2>::from -> Self with ",
    "replace \\| with \\^ in (Place::reference|Cursor::at)$",
    "table/writer\\.rs:(234|282):[0-9]+: replace \\| with \\^ in resolve_rows$",
    "decimal\\.rs:1503:41: replace \\| with \\^ in read_with$",
    "replace OwnedTable::chunk_is_empty -> Result<bool> with Ok\\(false\\)$",
    "replace Access<'r, R>::room -> Result<\\(usize, usize\\)> with ",
    "replace (prefetch|<impl Region for RawRegion>::prefetch(_record)?|Access<'r, R>::prefetch_(bucket|record)) with \\(\\)$",
    "table/batch\\.rs:1104:[0-9]+: replace .* in gather$",
    "table/batch\\.rs:11(59|60|71|73):[0-9]+: replace .* in gather_words$",
    "table/batch\\.rs:1088:8: delete ! in gather$",
    "table/batch\\.rs:973:34: replace >= with < in probe_rows$",
    "table/writer\\.rs:177:38: replace >= with < in resolve_rows$",
    "table/writer\\.rs:196:26: replace >> with << in resolve_rows$",
    "table/writer\\.rs:178:34: replace \\* with / in resolve_rows$",
    "table/record\\.rs:(957|979):10: replace > with >= in (copy|zero)_words$",
    "replace (Layout::tail_words -> usize with 0|/ with \\* in Layout::tail_words|- with \\+ in Layout::tail_words)$",
    "table/batch\\.rs:(450|578):18: replace < with > in append_(column_)?rows$",
    "table/batch\\.rs:903:23: replace && with \\|\\| in link_counting$",
    "replace (\\* with [+/]|\\*= with [+/]=) in Access<'r, R>::find_long$",
    "table/record\\.rs:438:22: replace == with != in Access<'r, R>::find$",
    "table/lanes\\.rs:121:18: replace == with != in probe_word$",
    "replace \\| with \\^ in place$",
    "replace <impl Drop for Block>::drop with \\(\\)$",
    "replace <impl Token for Avx2>::get -> Option<Self> with None$",
]

# A mutant that makes a loop endless is stopped at three times the
# baseline's test time.
timeout_multiplier = 3.0

# The tests of every crate of the product judge a mutant, not only its
# own crate's, cargo-mutants' default: a test of tessera-capi catches a
# mutant of tessera-kernels. A mutant of the kernels then builds 24 test
# programs for 11 and is caught sooner, the same 20 s in all (plan 9.21).
# The tools' tests depend on none of these crates.
test_package = [
    "relhash",
    "tessera-core",
    "tessera-kernels",
    "tessera-capi",
    "tessera-spill",
]

# Cargo.toml's profile of the tests without debug information: a mutant's
# build takes 14 s for 22 on a CI runner.
profile = "mutants"

additional_cargo_test_args = ["--locked"]
