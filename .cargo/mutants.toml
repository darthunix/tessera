# cargo-mutants (plans 9.9 and 9.21): which code a mutant may change and
# how the tests judge it. `make rust-mutants` runs every mutant; CI runs
# those in the lines a pull request changes, and every one on request,
# both on arm64 Linux: the NEON kernels compile on any aarch64 (on x86-64
# they are cut out by cfg, and their mutants would survive unseen).

# The tools, the test strategies, the benchmark programs and the loom
# model are not the product. The model's memory and model table
# (table/model.rs) compile only with --cfg loom, which a mutant's build
# lacks: each of their mutants would survive unseen.
exclude_globs = [
    "tools/**",
    "crates/tessera-testing/**",
    "crates/tessera-capi/benches/**",
    "**/loom.rs",
    "crates/tessera-kernels/src/table/model.rs",
]

# Debug output carries no logic; Display stays, it is the text of an error.
# The step of the walk over a word's bits (relhash::ones) makes every
# loop endless when mutated: a timeout each, never a verdict; its own
# tests check it.
# The same step written out where the iterator compiles to a longer loop
# or keeps no state between calls (WordValues::fold and next; the table's
# resolve_rows, append_rows, append_column_rows, and the keys'
# normalize_word and WordKeys::load, which those inline): their mutants
# of the step, their only &= and -.
# A batch of Datum rows all by value takes the column-wise path of an
# append (spill_columns::append) and writes the chunk the row-wise path
# writes: only the time tells them apart, so `by_value` false is the same.
# The ABI version is 0, so its mutant to 0 is the function itself.
# The constructors of the build's counters and of a spill over the loom
# model's words are compiled only for the model, which judges no mutant.
# sum_terms adds a word's decimals up by group before their records, for
# speed alone: exact sums add in any order, a NULL is skipped either way,
# and a row the local sums do not take goes to its record directly. A
# mutant that sends rows past them (local_group giving None or none from
# the start, the NULL arm gone, the guard false or turned) or that gives
# their hash of groups 18 slots for 32 leaves every sum and rest as it
# was. Two of these read as mutants the tests catch, so their place
# names them.
exclude_re = [
    "<impl [a-z:]*Debug for ",
    "<impl Iterator for Ones>::next",
    "replace (&= with [|^]=|- with [+/]) in (<impl Iterator for WordValues<F>>::(fold|next)|resolve_rows|append_rows|append_column_rows|normalize_word|WordKeys<'a>::load)$",
    "replace <impl RowValues for DatumRows<'_>>::by_value -> bool with false$",
    "replace tess_kernels_abi_version -> u32 with 0$",
    "replace (Counters|Spill)<W>::over -> Self with Default::default\\(\\)$",
    "replace local_group -> Option<usize> with None$",
    "accumulate\\.rs:255:25: replace == with != in local_group$",
    "delete match arm Term::Null in sum_terms$",
    "replace match guard decimal\\.scale\\(\\) <= .* with false in sum_terms$",
    "replace <= with > in sum_terms$",
    "accumulate\\.rs:399:50: replace \\|\\| with && in sum_terms$",
    "accumulate\\.rs:[0-9]+:[0-9]+: replace \\* with \\+$",
]

# A mutant that makes a loop endless is stopped at three times the
# baseline's test time.
timeout_multiplier = 3.0

# The tests of every crate of the product judge a mutant, not only its
# own crate's, cargo-mutants' default: a test of tessera-capi catches a
# mutant of tessera-kernels. A mutant of the kernels then builds 24 test
# programs for 11 and is caught sooner, the same 20 s in all (plan 9.21).
# The tools' tests depend on none of these crates.
test_package = [
    "relhash",
    "tessera-core",
    "tessera-kernels",
    "tessera-capi",
    "tessera-spill",
]

# Cargo.toml's profile of the tests without debug information: a mutant's
# build takes 14 s for 22 on a CI runner.
profile = "mutants"

additional_cargo_test_args = ["--locked"]
